<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ストップウォッチ</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; background: #f2f2f2;
  }
  .sw { width: 300px; background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.1); text-align: center; }
  .time {
    padding: 16px 0; margin-bottom: 16px; border-radius: 8px; background: #222; color: #fff;
    font-size: 40px; font-variant-numeric: tabular-nums;
  }
  .buttons { display: flex; gap: 10px; }
  button { flex: 1; height: 52px; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; }
  button:active { filter: brightness(.9); }
  #toggle { background: #34c759; color: #fff; }
  #toggle.running { background: #ff9500; }
  #reset { background: #e6e6e6; }
</style>
</head>
<body>
<div class="sw">
  <div class="time" id="time">00:00.00</div>
  <div class="buttons">
    <button id="toggle">スタート</button>
    <button id="reset">リセット</button>
  </div>
</div>
<script>
  const timeEl = document.getElementById('time');
  const toggleBtn = document.getElementById('toggle');
  const resetBtn = document.getElementById('reset');

  let elapsed = 0;      // 止めた時点までの経過ミリ秒
  let startedAt = null; // 動作中なら開始時刻
  let timer = null;

  function format(ms) {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000);
    const pad = n => String(n).padStart(2, '0');
    return `${pad(m)}:${pad(s)}.${pad(cs)}`;
  }
  function now() { return elapsed + (startedAt === null ? 0 : performance.now() - startedAt); }
  function render() { timeEl.textContent = format(now()); }

  toggleBtn.addEventListener('click', () => {
    if (startedAt === null) {
      startedAt = performance.now();
      timer = setInterval(render, 30);
      toggleBtn.textContent = 'ストップ';
      toggleBtn.classList.add('running');
    } else {
      elapsed = now();
      startedAt = null;
      clearInterval(timer);
      render();
      toggleBtn.textContent = 'スタート';
      toggleBtn.classList.remove('running');
    }
  });
  resetBtn.addEventListener('click', () => {
    elapsed = 0;
    if (startedAt !== null) startedAt = performance.now();
    render();
  });
</script>
</body>
</html>
