<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>計算機</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; background: #f2f2f2;
  }
  .calc { width: 280px; background: #fff; border-radius: 12px; padding: 16px; box-shadow: 0 2px 10px rgba(0,0,0,.1); }
  .display {
    height: 64px; margin-bottom: 12px; padding: 0 12px; border-radius: 8px; background: #222; color: #fff;
    font-size: 32px; display: flex; align-items: center; justify-content: flex-end; overflow: hidden;
  }
  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  button {
    height: 52px; border: none; border-radius: 8px; font-size: 20px; cursor: pointer; background: #e6e6e6;
  }
  button:active { filter: brightness(.9); }
  .op { background: #ffb340; }
  .eq { background: #3478f6; color: #fff; }
  .clear { background: #ff6b6b; color: #fff; }
  .zero { grid-column: span 2; }
</style>
</head>
<body>
<div class="calc">
  <div class="display" id="display">0</div>
  <div class="keys">
    <button class="clear" data-action="clear">C</button>
    <button data-action="sign">±</button>
    <button data-action="back">⌫</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button><button data-num="8">8</button><button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button><button data-num="5">5</button><button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button><button data-num="2">2</button><button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-num="0">0</button>
    <button data-num=".">.</button>
    <button class="eq" data-action="equals">=</button>
  </div>
</div>
<script>
  const display = document.getElementById('display');
  let current = '0';     // 入力中の数
  let stored = null;     // 前の数
  let op = null;         // 待機中の演算子
  let fresh = false;     // 次の数字入力で current を置き換えるか

  function calc(a, b, o) {
    switch (o) {
      case '+': return a + b;
      case '-': return a - b;
      case '*': return a * b;
      case '/': return b === 0 ? NaN : a / b;
    }
    return b;
  }
  function format(n) {
    if (!isFinite(n)) return 'エラー';
    return String(parseFloat(n.toPrecision(12)));
  }
  function show() { display.textContent = current; }

  function inputNum(d) {
    if (fresh || current === 'エラー') { current = '0'; fresh = false; }
    if (d === '.') { if (!current.includes('.')) current += '.'; }
    else current = current === '0' ? d : current + d;
    if (current.replace(/[-.]/g, '').length > 12) current = current.slice(0, -1);
    show();
  }
  function inputOp(o) {
    if (current === 'エラー') return;
    if (op !== null && !fresh) current = format(calc(stored, parseFloat(current), op));
    stored = parseFloat(current);
    op = o; fresh = true;
    show();
  }
  function equals() {
    if (op === null || current === 'エラー') return;
    current = format(calc(stored, parseFloat(current), op));
    op = null; stored = null; fresh = true;
    show();
  }
  function action(a) {
    if (a === 'clear') { current = '0'; stored = null; op = null; fresh = false; }
    else if (a === 'equals') return equals();
    else if (current === 'エラー') return;
    else if (a === 'sign') { if (current !== '0') current = current.startsWith('-') ? current.slice(1) : '-' + current; }
    else if (a === 'back') { if (!fresh) current = current.length > 1 && current !== '-0' ? current.slice(0, -1) : '0'; if (current === '-') current = '0'; }
    show();
  }

  document.querySelector('.keys').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.num) inputNum(b.dataset.num);
    else if (b.dataset.op) inputOp(b.dataset.op);
    else action(b.dataset.action);
  });
  document.addEventListener('keydown', e => {
    if (/^[0-9.]$/.test(e.key)) inputNum(e.key);
    else if ('+-*/'.includes(e.key)) inputOp(e.key);
    else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); equals(); }
    else if (e.key === 'Backspace') action('back');
    else if (e.key === 'Escape') action('clear');
  });
</script>
</body>
</html>
